name: Set up gh
description: >-
  Install a pinned GitHub CLI into the job's temp directory and put it on PATH.
  The self-hosted -turing runner images do not all ship gh.

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_VERSION: 2.103.3
        GH_SHA256_AMD64: 4c806978ffce1cec70853302a56d70ac6da4f19bae7adca4e1a8ab00633dd91d
        GH_SHA256_ARM64: ee32df2323c8847f5fac6cb6b4b69ca75828e9329a8f22f677021f7b3306ce63
      run: |
        set -euo pipefail

        case "$(uname -m)" in
            x86_64)
                arch=amd64
                sha256=$GH_SHA256_AMD64
                ;;
            aarch64)
                arch=arm64
                sha256=$GH_SHA256_ARM64
                ;;
            *)
                echo "::error::No gh build for $(uname -m)"
                exit 1
                ;;
        esac

        name="gh_${GH_VERSION}_linux_${arch}"
        dir="$RUNNER_TEMP/gh"
        mkdir -p "$dir"

        curl -fsSL -o "$dir/$name.tar.gz" "https://github.com/cli/cli/releases/download/v${GH_VERSION}/$name.tar.gz"
        echo "$sha256  $dir/$name.tar.gz" | sha256sum -c -
        tar -xzf "$dir/$name.tar.gz" -C "$dir"

        echo "$dir/$name/bin" >> "$GITHUB_PATH"
        "$dir/$name/bin/gh" --version
