name: Clean self-hosted runner
description: >-
  Reclaim disk on the persistent self-hosted -turing runners by deleting what
  is regenerated each job: workspace build trees and the container writable
  layer (HOME caches + /tmp). Never touches external/ (the dependency and
  dataset caches, which the cache actions save in their post-steps) or .git.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        # Best-effort: never fail the job because cleanup hit a stray file.
        set +e
        echo "::group::Disk before cleanup"
        df -h / 2>/dev/null | tail -1
        echo "::endgroup::"

        # 1) Container writable-layer growth. These live inside the container
        #    (not on a bind-mount) and are recreated by the job when needed:
        #    .local/.cache are uv/pip caches; .turing is created (empty) by
        #    turingdb's default config — the "Prepare SimpleDB" step writes to
        #    RUNNER_TEMP instead. /tmp is per-container scratch.
        rm -rf "${HOME:?}/.local" "${HOME:?}/.cache" "${HOME:?}/.turing" 2>/dev/null
        sudo rm -rf /tmp/* /tmp/.[!.]* 2>/dev/null

        # 2) Workspace build trees, regenerated by ./build.sh + the test steps.
        #    Deliberately excludes external/ (dependency + dataset caches) and
        #    .git so the caches stay intact and the checkout is not re-cloned.
        if [ -n "${GITHUB_WORKSPACE:-}" ] && cd "${GITHUB_WORKSPACE}"; then
          rm -rf build .venv .venv-test wheel dist ./*.tar 2>/dev/null
        fi

        echo "::group::Disk after cleanup"
        df -h / 2>/dev/null | tail -1
        echo "::endgroup::"
        exit 0
