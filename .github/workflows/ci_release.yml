name: CI Release

on:
  workflow_dispatch:


jobs:
  docker:
    name: Publish the x86 docker image of v3.0
    runs-on: ubuntu-24.04-turing
    permissions:
      actions: read
      contents: read
    env:
      IMAGE: turingdbai/turingdb:3.0-amd64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download x86 py3.14 wheel artifact of run 36955304971
        uses: actions/download-artifact@v4
        with:
          name: turingdb-wheel-ubuntu-24.04-turing-py3.14
          path: wheel/
          run-id: 36955304971
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the wheel
        run: |
          ls -la wheel/
          COUNT=$(ls wheel/ | wc -l)
          if [ "$COUNT" != "1" ] || ! ls wheel/ | grep -qE '^turingdb-3\.0-cp314-cp314-manylinux_2_39_x86_64\.whl$'; then
            echo "ERROR: expected the turingdb-3.0 cp314 x86_64 wheel only"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          load: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}

      - name: Test Docker image
        run: docker run --rm $IMAGE turingdb --help

      - name: Reclaim disk (self-hosted)
        if: always()
        uses: ./.github/actions/clean-self-hosted-runner
