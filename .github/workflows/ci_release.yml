name: CI Release

on:
  workflow_dispatch:


jobs:
  publish:
    name: Publish x86 wheels of v3.0 to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/turingdb
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download x86 wheel artifacts of run 36955304971
        uses: actions/download-artifact@v4
        with:
          pattern: turingdb-wheel-ubuntu-*-turing-*
          path: wheel/
          merge-multiple: true
          run-id: 36955304971
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the wheels
        run: |
          ls -la wheel/
          COUNT=$(ls wheel/ | wc -l)
          MATCHING=$(ls wheel/ | grep -cE '^turingdb-3\.0-cp3(10|11|12|13|14)-cp3(10|11|12|13|14)-manylinux_2_(35|39)_x86_64\.whl$')
          if [ "$COUNT" != "10" ] || [ "$MATCHING" != "10" ]; then
            echo "ERROR: expected 10 turingdb-3.0 x86_64 wheels, found $COUNT files, $MATCHING matching"
            exit 1
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: wheel/
          verbose: true
          skip-existing: true
