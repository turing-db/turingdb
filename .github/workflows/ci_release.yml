name: CI Release

on:
  workflow_dispatch:


jobs:
  build-release:
    uses: ./.github/workflows/ci_build.yml
    with:
      os_list: '["macos15", "macos26"]'
      python_version_list: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
      version_override: '3.0'
    secrets: inherit

  publish:
    name: Publish macOS wheels of v3.0 to PyPI
    needs: build-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/turingdb
    permissions:
      id-token: write
    steps:
      - name: Download macOS wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: turingdb-wheel-macos*
          path: wheel/
          merge-multiple: true

      - name: Check the wheels
        run: |
          ls -la wheel/
          COUNT=$(ls wheel/ | wc -l)
          MATCHING=$(ls wheel/ | grep -cE '^turingdb-3\.0-cp3(10|11|12|13|14)-cp3(10|11|12|13|14)-macosx_[0-9]+_[0-9]+_arm64\.whl$')
          if [ "$COUNT" != "10" ] || [ "$MATCHING" != "10" ]; then
            echo "ERROR: expected 10 turingdb-3.0 macOS arm64 wheels, found $COUNT files, $MATCHING matching"
            exit 1
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: wheel/
          verbose: true
          skip-existing: true
