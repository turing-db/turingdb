name: CI Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:


jobs:
  setup:
    runs-on: ubuntu-24.04-turing
    outputs:
      os_list: '["ubuntu-22.04-turing", "ubuntu-24.04-turing", "ubuntu-22.04-arm", "ubuntu-24.04-arm", "macos14-turing", "macos15-turing", "macos26-turing"]'
      python_version_list: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
      dev_version_suffix: ${{ steps.suffix.outputs.value }}
    steps:
      - run: echo "Defining matrix"
      - name: Compute dev version suffix for nightly builds
        id: suffix
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: echo "value=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

  build-release:
    needs: setup
    uses: ./.github/workflows/ci_build.yml
    with:
      os_list: ${{ needs.setup.outputs.os_list }}
      python_version_list: ${{ needs.setup.outputs.python_version_list }}
      dev_version_suffix: ${{ needs.setup.outputs.dev_version_suffix }}
    secrets: inherit

  publish:
    name: Publish to PyPI
    needs: build-release
    runs-on: ubuntu-24.04-turing
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    environment:
      name: pypi
      url: https://pypi.org/p/turingdb
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: turingdb-wheel-*
          path: wheel/
          merge-multiple: true

      - name: Extract version from wheel filename
        id: get-version
        run: |
          WHEEL=$(ls wheel/*.whl | head -1)
          VERSION=$(basename "$WHEEL" | sed 's/^turingdb-\([^-]*\)-.*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: wheel/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: wheel/
          verbose: true

  test-published-wheel:
    name: Test published wheel 
    needs: [publish, setup]
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.setup.outputs.os_list) }}
        python_version: ${{ fromJson(needs.setup.outputs.python_version_list) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Setup Python
        run: uv python install ${{ matrix.python_version }}

      - name: Install turingdb from PyPI
        run: |
          uv venv .venv --python ${{ matrix.python_version }}
          sleep 120
          for i in 1 2 3 4 5; do
            uv pip install turingdb==${{ needs.publish.outputs.version }} --prerelease allow --refresh --python .venv/bin/python && break
            echo "Attempt $i failed, retrying in 120s..."
            sleep 120
          done
          .venv/bin/python -c "import turingdb" || { echo "ERROR: turingdb failed to install after 5 attempts"; exit 1; }

      - name: Verify installed version matches
        run: |
          INSTALLED=$(.venv/bin/python -c "import importlib.metadata; print(importlib.metadata.version('turingdb'))")
          EXPECTED="${{ needs.publish.outputs.version }}"
          echo "Installed: $INSTALLED"
          echo "Expected:  $EXPECTED"
          if [ "$INSTALLED" != "$EXPECTED" ]; then
            echo "ERROR: Version mismatch!"
            exit 1
          fi

      - name: Verify turingdb launches
        timeout-minutes: 3
        run: .venv/bin/turingdb --help
