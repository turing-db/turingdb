name: CI Release

on:
  workflow_dispatch:


jobs:
  delete-tag:
    name: Delete the nightly docker tag
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Delete turingdbai/turingdb:nightly
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          JWT=$(curl -sf -H 'Content-Type: application/json' \
            -d "{\"username\": \"$DOCKERHUB_USERNAME\", \"password\": \"$DOCKERHUB_TOKEN\"}" \
            https://hub.docker.com/v2/users/login/ | jq -r .token)
          echo "::add-mask::$JWT"
          STATUS=$(curl -s -o response.txt -w '%{http_code}' -X DELETE -H "Authorization: JWT $JWT" \
            https://hub.docker.com/v2/repositories/turingdbai/turingdb/tags/nightly/)
          echo "DELETE status: $STATUS"
          cat response.txt
          [ "$STATUS" = "204" ]
