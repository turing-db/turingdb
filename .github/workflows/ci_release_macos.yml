name: Release macOS

on:
  schedule:
    - cron: "0 2 * * *"
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-release:
    name: Build Release Wheels
    runs-on: macos-14
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        persist-credentials: true
        lfs: true
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v3

    - name: Setup Python
      run: uv python install ${{ matrix.python-version }}

    - name: Install LLVM
      run: |
        # Use official LLVM releases (target macOS 11.0+) instead of Homebrew (targets macOS 15.0)
        curl -L -o llvm.tar.xz https://github.com/llvm/llvm-project/releases/download/llvmorg-19.1.6/LLVM-19.1.6-macOS-ARM64.tar.xz
        mkdir -p $HOME/llvm
        tar -xf llvm.tar.xz -C $HOME/llvm --strip-components=1
        echo "LLVM_PREFIX=$HOME/llvm" >> $GITHUB_ENV

    - name: Install OpenMP runtime
      run: |
        # Official LLVM macOS releases don't include libomp; get it from R-project (targets macOS 11+ on ARM64)
        curl -O https://mac.r-project.org/openmp/openmp-19.1.5-darwin20-Release.tar.gz
        sudo tar fvxz openmp-19.1.5-darwin20-Release.tar.gz -C /

    - name: Cache dependencies
      id: cache-dependencies
      uses: actions/cache@v4
      with:
        path: external/dependencies
        key: macos-14-dependencies-${{ hashFiles('dependencies.sh', '.gitmodules') }}
        save-always: true

    - name: Install dependencies
      run: ./dependencies.sh
      env:
        SKIP_BUILD_IF_CACHED: ${{ steps.cache-dependencies.outputs.cache-hit }}

    - name: Build wheel
      run: |
        # Convert Python version (e.g., "3.10") to tag format (e.g., "cp310")
        export PYTHON_TAG="cp$(echo '${{ matrix.python-version }}' | tr -d '.')"
        source ${{ github.workspace }}/setup.sh
        uv build --wheel --python ${{ matrix.python-version }}
      env:
        # Use LLVM's lld linker to avoid Xcode linker loading wrong libc++ at runtime
        # Add -fexperimental-library to enable std::jthread support in LLVM 19's libc++
        CMAKE_ARGS: "-DCMAKE_C_COMPILER=${{ env.LLVM_PREFIX }}/bin/clang -DCMAKE_CXX_COMPILER=${{ env.LLVM_PREFIX }}/bin/clang++ -DCMAKE_CXX_FLAGS=-fexperimental-library -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld -DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=lld -DCMAKE_MODULE_LINKER_FLAGS=-fuse-ld=lld"

    - name: Prepare SimpleDB
      run: |
        cd build/samples/simpledb
        ./simpledb
        mkdir -p $HOME/.turing/graphs
        cp -r simpledb.out/simpledb $HOME/.turing/graphs

    - name: Run unit tests
      run: |
        cd build
        make test

    - name: Repair wheel with delocate
      run: |
        mkdir -p wheelhouse
        uvx --from delocate delocate-wheel --require-archs arm64 -w wheelhouse dist/*.whl

    - name: Fix wheel platform tags
      run: |
        cd wheelhouse
        # Get Python version tag (e.g., cp313)
        PYTHON_TAG="cp$(echo '${{ matrix.python-version }}' | tr -d '.')"

        for wheel in *.whl; do
          echo "Processing: $wheel"

          # Extract wheel name components
          # Format: {name}-{version}-{python}-{abi}-{platform}.whl

          # Rename wheel with proper macOS platform tag
          # delocate doesn't rename wheels, so we need to do it manually
          NEW_WHEEL=$(echo "$wheel" | sed "s/-none-any\.whl/-${PYTHON_TAG}-macosx_14_0_arm64.whl/")

          if [ "$wheel" != "$NEW_WHEEL" ]; then
            # Unpack, update WHEEL metadata, and repack
            TMPDIR=$(mktemp -d)
            unzip -q "$wheel" -d "$TMPDIR"

            # Update the WHEEL file with correct tags
            WHEEL_FILE=$(find "$TMPDIR" -name "WHEEL" -path "*dist-info*")
            if [ -f "$WHEEL_FILE" ]; then
              sed -i '' "s/Tag: ${PYTHON_TAG}-none-any/Tag: ${PYTHON_TAG}-${PYTHON_TAG}-macosx_14_0_arm64/" "$WHEEL_FILE"
            fi

            # Update RECORD file (remove old hashes, wheel will regenerate on install)
            RECORD_FILE=$(find "$TMPDIR" -name "RECORD" -path "*dist-info*")
            if [ -f "$RECORD_FILE" ]; then
              # Update WHEEL entry in RECORD
              sed -i '' "s/Tag: ${PYTHON_TAG}-none-any/Tag: ${PYTHON_TAG}-${PYTHON_TAG}-macosx_14_0_arm64/" "$RECORD_FILE" 2>/dev/null || true
            fi

            # Repack with correct filename
            rm "$wheel"
            cd "$TMPDIR"
            zip -q -r "../$NEW_WHEEL" .
            cd ..
            rm -rf "$TMPDIR"

            echo "Renamed to: $NEW_WHEEL"
          fi
        done

    - name: Verify wheel platform tags
      run: |
        echo "Verifying wheel platform tags..."
        for wheel in wheelhouse/*.whl; do
          if [[ "$wheel" == *"-none-any.whl" ]]; then
            echo "ERROR: Found platform-independent wheel: $wheel"
            echo "Packages with native binaries must have platform-specific tags"
            exit 1
          fi
          echo "OK: $wheel"
        done

    - name: Run regress
      run: |
        cd build
        source ${{ github.workspace }}/setup.sh
        make run_regress

    - name: Upload wheel artifact
      uses: actions/upload-artifact@v4
      with:
        name: turingdb-wheel-macos-py${{ matrix.python-version }}
        path: wheelhouse/*.whl

  publish:
    name: Publish to PyPI
    needs: build-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/turingdb
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: turingdb-wheel-macos-py*
          path: wheelhouse/
          merge-multiple: true

      - name: Verify no platform-independent wheels
        run: |
          echo "Final verification before publish..."
          for wheel in wheelhouse/*.whl; do
            if [[ "$wheel" == *"-none-any.whl" ]]; then
              echo "ERROR: Found platform-independent wheel: $wheel"
              exit 1
            fi
            echo "Will publish: $wheel"
          done

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: wheelhouse/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheelhouse/
          skip-existing: true
