name: CI Sanitizers

on:
  schedule:
    - cron: '0 1 * * *'

  workflow_dispatch:


concurrency:
  group: ci-sanitizers-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read


jobs:
  asan-ubsan:
    name: ASan and UBSan unit tests
    strategy:
      matrix:
        os: [ "ubuntu-24.04-turing" ]
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read
      pull-requests: read

    outputs:
      has_prs: ${{ steps.agent.outputs.has_prs }}

    env:
      BUILD_JOBS: 4
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CTEST_PARALLEL_LEVEL: 4
      PYTHON_VERSION: '3.14'

    steps:
    - name: Use the host's build parallelism
      run: |
        if [ -n "${HOST_BUILD_JOBS:-}" ]; then
          echo "BUILD_JOBS=$HOST_BUILD_JOBS" >> "$GITHUB_ENV"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$HOST_BUILD_JOBS" >> "$GITHUB_ENV"
          echo "CTEST_PARALLEL_LEVEL=$HOST_BUILD_JOBS" >> "$GITHUB_ENV"
        fi

    # The agent blames the faulty lines, so it needs the history. It gets no write token.
    - uses: actions/checkout@v4
      with:
        lfs: true
        fetch-depth: 0
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@v3

    - name: Build dependencies
      uses: ./.github/actions/build-dependencies
      with:
        os: ${{ matrix.os }}

    - name: Setup Python
      run: uv python install "$PYTHON_VERSION"

    - name: Configure
      run: |
        mkdir -p build
        cd build
        cmake -G Ninja -DTURING_SANITIZE="address;undefined" -DPython_EXECUTABLE="$(uv python find "$PYTHON_VERSION")" ..

    - name: Build
      run: ninja -C build -j "$BUILD_JOBS"

    # gtest reads GTEST_REPEAT from the environment. TuringTestMain turns shuffle on, and
    # gtest draws and prints a new seed for each iteration. Truncating the head of a long
    # output keeps its tail, where the sanitizer report and the failing seed are.
    # LLVM's Allocator.h poisons slabs when compiled with ASan, and the uninstrumented MLIR
    # library never unpoisons them, so allow_user_poisoning=0 turns that poisoning off.
    - name: Run unit tests 10 times, shuffled
      id: tests
      env:
        GTEST_REPEAT: 10
        ASAN_OPTIONS: detect_stack_use_after_return=1:detect_leaks=1:allow_user_poisoning=0
        LSAN_OPTIONS: suppressions=${{ github.workspace }}/test/lsan_suppressions.txt
        UBSAN_OPTIONS: print_stacktrace=1
      run: |
        cd build
        ctest --output-on-failure --timeout 7200 --test-output-truncation head

    - name: Upload test log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: sanitizer-test-log
        path: build/Testing/Temporary/LastTest.log

    - name: Setup Node.js
      if: failure() && steps.tests.outcome == 'failure' && github.ref == 'refs/heads/main'
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Claude Code
      if: failure() && steps.tests.outcome == 'failure' && github.ref == 'refs/heads/main'
      run: npm install -g --engine-strict @anthropic-ai/claude-code@latest

    - name: Install gh
      if: failure() && steps.tests.outcome == 'failure' && github.ref == 'refs/heads/main'
      uses: ./.github/actions/setup-gh

    # Fixes the simple findings as stacked sanitizers/* branches and files Linear tickets for
    # the others. The open-prs job pushes the branches, so this job never holds a write token.
    - name: Investigate the findings
      id: agent
      if: failure() && steps.tests.outcome == 'failure' && github.ref == 'refs/heads/main'
      timeout-minutes: 180
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        GH_TOKEN: ${{ github.token }}
        SANITIZER_OUT: ${{ runner.temp }}/sanitizer-agent
        SANITIZER_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        ASAN_OPTIONS: detect_stack_use_after_return=1:detect_leaks=1:allow_user_poisoning=0
        LSAN_OPTIONS: suppressions=${{ github.workspace }}/test/lsan_suppressions.txt
        UBSAN_OPTIONS: print_stacktrace=1
        GIT_AUTHOR_NAME: github-actions[bot]
        GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        GIT_COMMITTER_NAME: github-actions[bot]
        GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      run: bash scripts/sanitizer_agent.sh

    - name: Upload the agent's fixes
      if: failure() && steps.agent.outcome != 'skipped'
      uses: actions/upload-artifact@v4
      with:
        name: sanitizer-agent
        if-no-files-found: ignore
        path: |
          ${{ runner.temp }}/sanitizer-agent/summary.md
          ${{ runner.temp }}/sanitizer-agent/prs.tsv
          ${{ runner.temp }}/sanitizer-agent/pr-*.md
          ${{ runner.temp }}/sanitizer-agent/fixes.bundle

    - name: Reclaim disk (self-hosted)
      if: always()
      uses: ./.github/actions/clean-self-hosted-runner


  open-prs:
    name: Open the sanitizer fix PRs
    needs: asan-ubsan
    if: always() && needs.asan-ubsan.outputs.has_prs == 'true'
    runs-on: ubuntu-24.04-turing

    permissions:
      contents: read
      actions: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.SANITIZER_PR_TOKEN }}

    - uses: actions/download-artifact@v4
      with:
        name: sanitizer-agent
        path: ${{ runner.temp }}/sanitizer-agent

    - name: Install gh
      uses: ./.github/actions/setup-gh

    - name: Push the fix branches and open the PRs
      env:
        SANITIZER_OUT: ${{ runner.temp }}/sanitizer-agent
        GH_TOKEN: ${{ secrets.SANITIZER_PR_TOKEN }}
        DISPATCH_TOKEN: ${{ github.token }}
      run: bash scripts/open_sanitizer_prs.sh
