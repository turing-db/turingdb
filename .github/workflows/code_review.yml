name: Code Style Review

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '**.cpp'
      - '**.h'
      - '**.hpp'

concurrency:
  group: code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # First job: Claude Code AI review (analysis phase)
  claude-review:
    runs-on: ubuntu-24.04-turing

    permissions:
      contents: read

    outputs:
      has_violations: ${{ steps.review.outputs.has_violations || 'false' }}
      review_body: ${{ steps.review.outputs.review_body }}

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch base branch
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch origin ${{ github.base_ref }}

      - name: Run Claude review
        id: review
        env:
          BASE_REF: ${{ github.base_ref }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bash scripts/claude_review.sh

  # Second job: Post Claude review comment (has write access, only runs trusted code)
  claude-comment:
    runs-on: ubuntu-24.04-turing
    needs: claude-review
    if: always() && needs.claude-review.result == 'success'

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}

      - name: Post review comment
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          HAS_VIOLATIONS: ${{ needs.claude-review.outputs.has_violations }}
          REVIEW_BODY: ${{ needs.claude-review.outputs.review_body }}
        run: bash scripts/post_review_comment.sh
