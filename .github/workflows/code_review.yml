name: Code Style Review

on:
  pull_request_target:
    types: [opened, synchronize]
    paths:
      - '**.cpp'
      - '**.h'
      - '**.hpp'

concurrency:
  group: code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # First job: Claude Code AI review (analysis phase)
  claude-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    outputs:
      has_violations: ${{ steps.parse.outputs.has_violations || steps.no_diff.outputs.has_violations || 'false' }}
      review_body: ${{ steps.parse.outputs.review_body }}

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch base branch
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch origin ${{ github.base_ref }}

      - name: Generate C++ diff
        id: diff
        run: |
          diff_output=$(git diff origin/${{ github.base_ref }}..HEAD -- '*.cpp' '*.h' '*.hpp')
          if [ -z "$diff_output" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "No C++ file changes found in this PR."
          else
            echo "$diff_output" | head -c 153600 > /tmp/cpp_diff.patch
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Read style guides from base branch
        if: steps.diff.outputs.skip != 'true'
        run: |
          git show origin/${{ github.base_ref }}:CODING_STYLE.md > /tmp/CODING_STYLE.md 2>/dev/null || echo "No CODING_STYLE.md on base branch." > /tmp/CODING_STYLE.md
          git show origin/${{ github.base_ref }}:REVIEW.md > /tmp/REVIEW.md 2>/dev/null || echo "No REVIEW.md on base branch." > /tmp/REVIEW.md

      - name: Build review prompt
        if: steps.diff.outputs.skip != 'true'
        run: |
          cat > /tmp/review_prompt.txt << 'PROMPT_HEADER'
          You are an expert C++ code reviewer. Review the following diff against the
          coding style guide and the review checklist provided below.

          RULES:
          - Only flag lines that were ADDED in the diff (lines starting with +).
          - Only flag CLEAR violations — do not speculate or flag ambiguous cases.
          - For each violation, cite the specific rule from CODING_STYLE.md or REVIEW.md.
          - Also flag consistency issues: e.g. switch statements where cases mix
            different termination styles (some use break, others return). These are
            valid findings even if they are not purely formatting-related.
          - If there are NO violations, output exactly the word NO_VIOLATIONS and nothing else.
          - If there ARE violations, output a markdown table with these columns:
            | File | Line | Rule | Violation |

          VERIFICATION:
          - Before reporting any violation, re-read the exact diff lines to confirm it.
          - Pay special attention to multi-line constructs (constructors, function
            signatures, initializer lists). A brace '{' on the NEXT line in the diff
            is on a separate line — do not confuse consecutive diff lines with being
            on the same source line.
          - If you are not certain a violation exists after re-reading, do NOT include it.

          COMMON FALSE POSITIVES TO AVOID:
          - Template methods MUST be defined in headers (C++ language requirement) — do
            not flag them as "big implementation code in headers."
          - One-liner getters, setters, and accessors in headers are NOT "big
            implementation code."
          - Pointers, bools, enums, and other POD/trivial types are NOT "non-trivial
            member variables" — classes with only these members do not need explicit
            constructors/destructors in a cpp file.
          - Multi-line function arguments: both parenthesis-aligned and flat/uniform
            indentation are acceptable, as long as each argument is on its own line
            and consistently indented below the others. Do NOT flag flat indentation
            as a violation of the alignment rule.

          OUTPUT FORMAT:
          - Your COMPLETE response must be ONLY the final table or NO_VIOLATIONS.
          - Do NOT include any reasoning, analysis, commentary, or intermediate work.
          - Do NOT retract or revise findings in the output — do all analysis internally
            before producing your single final answer.
          - Do NOT output multiple tables. Output exactly ONE table with your final results.
          - No preamble, no summary, no "Final table:", no "Let me review" — just the table.

          PROMPT_HEADER

          echo "" >> /tmp/review_prompt.txt
          echo "## CODING_STYLE.md" >> /tmp/review_prompt.txt
          echo '```' >> /tmp/review_prompt.txt
          cat /tmp/CODING_STYLE.md >> /tmp/review_prompt.txt
          echo '```' >> /tmp/review_prompt.txt

          echo "" >> /tmp/review_prompt.txt
          echo "## REVIEW.md" >> /tmp/review_prompt.txt
          echo '```' >> /tmp/review_prompt.txt
          cat /tmp/REVIEW.md >> /tmp/review_prompt.txt
          echo '```' >> /tmp/review_prompt.txt

          echo "" >> /tmp/review_prompt.txt
          echo "## Diff to review" >> /tmp/review_prompt.txt
          echo '```diff' >> /tmp/review_prompt.txt
          cat /tmp/cpp_diff.patch >> /tmp/review_prompt.txt
          echo '```' >> /tmp/review_prompt.txt

      - name: Run Claude Code review
        if: steps.diff.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is not set"
            exit 1
          fi
          cd /tmp
          set +e
          claude -p --verbose --model claude-sonnet-4-5-20250929 \
            < /tmp/review_prompt.txt \
            > /tmp/claude_review_output.txt 2>&1
          exit_code=$?
          set -e
          if [ $exit_code -ne 0 ]; then
            echo "::error::Claude Code exited with code $exit_code"
            echo "--- Claude output ---"
            cat /tmp/claude_review_output.txt
            echo "--- End output ---"
            exit $exit_code
          fi

      - name: Parse Claude output
        id: parse
        if: steps.diff.outputs.skip != 'true'
        run: |
          output=$(cat /tmp/claude_review_output.txt)

          # Fail fast on API errors (credit exhaustion, auth failure, rate limits)
          if echo "$output" | grep -qiE "credit|billing|quota|rate.limit|unauthorized|authentication|forbidden|insufficient_funds|overloaded|payment required"; then
            echo "::error::Claude API error detected (possible credit/billing issue):"
            echo "$output"
            exit 1
          fi

          if echo "$output" | grep -q "NO_VIOLATIONS"; then
            echo "has_violations=false" >> $GITHUB_OUTPUT
            echo "review_body=" >> $GITHUB_OUTPUT
            echo "Claude found no violations."
          else
            # Extract only the last markdown table from the output.
            # The model may produce intermediate tables during reasoning;
            # we only want the final one.
            python3 - << 'PYEOF'
          import re, sys, base64

          with open("/tmp/claude_review_output.txt") as f:
              text = f.read()

          # Find all markdown tables (header + separator + data rows)
          table_pattern = re.compile(
              r'(\|[^\n]+\|\n'        # header row
              r'\|[-| :]+\|\n'        # separator row
              r'(?:\|[^\n]+\|\n?)+)', # one or more data rows
              re.MULTILINE
          )
          tables = table_pattern.findall(text)

          if tables:
              last_table = tables[-1].strip()
              with open("/tmp/claude_review_clean.txt", "w") as f:
                  f.write(last_table)
          else:
              # No table found — pass through raw output
              with open("/tmp/claude_review_clean.txt", "w") as f:
                  f.write(text.strip())
          PYEOF

            cleaned=$(cat /tmp/claude_review_clean.txt)
            encoded=$(echo "$cleaned" | base64 -w0)
            echo "has_violations=true" >> $GITHUB_OUTPUT
            echo "review_body=$encoded" >> $GITHUB_OUTPUT
            echo "Claude found violations."
          fi

      - name: Set no violations when diff is empty
        id: no_diff
        if: steps.diff.outputs.skip == 'true'
        run: |
          echo "has_violations=false" >> $GITHUB_OUTPUT
          echo "review_body=" >> $GITHUB_OUTPUT

  # Second job: Post Claude review comment (has write access, only runs trusted code)
  claude-comment:
    runs-on: ubuntu-latest
    needs: claude-review
    if: always() && needs.claude-review.result == 'success'

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}

      - name: Delete previous Claude review comments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
            --paginate --jq '.[] | select(.body | contains("<!-- claude-code-review -->")) | .id' \
            | while read -r comment_id; do
                echo "Deleting previous Claude review comment $comment_id"
                gh api -X DELETE repos/${{ github.repository }}/issues/comments/$comment_id
              done

      - name: Post Claude review comment
        if: needs.claude-review.outputs.has_violations == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          review_body=$(echo "${{ needs.claude-review.outputs.review_body }}" | base64 -d)

          cat > /tmp/comment_body.md << 'EOF'
          <!-- claude-code-review -->
          ## Claude Code Review

          <details>
          <summary>Style violations found (click to expand)</summary>

          EOF

          echo "$review_body" >> /tmp/comment_body.md

          cat >> /tmp/comment_body.md << 'EOF'

          </details>

          ---
          *Checked against [CODING_STYLE.md](../blob/${{ github.head_ref }}/CODING_STYLE.md) and [REVIEW.md](../blob/${{ github.head_ref }}/REVIEW.md).*
          EOF

          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/comment_body.md

      - name: Fail if violations found
        if: needs.claude-review.outputs.has_violations == 'true'
        run: |
          echo "::error::Claude Code review found style violations. Please fix them before merging."
          exit 1
