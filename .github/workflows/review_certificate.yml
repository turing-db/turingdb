name: Review Certificate

# pull_request_target runs the base branch's script, which only reads the PR's commits and
# never runs them. A PR cannot change the check that judges it, and a fork PR's run can post.
# The verdict is the review-certificate/<base> commit status on the PR head.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  issue_comment:
    types: [created, edited, deleted]

jobs:
  verify:
    if: >-
      (github.event_name == 'pull_request_target'
        && (github.event.action != 'edited' || github.event.changes.base))
      || (github.event.issue.pull_request
        && (startsWith(github.event.comment.body, '<!-- turingdb-review-certificate -->')
          || startsWith(github.event.changes.body.from, '<!-- turingdb-review-certificate -->')))
    runs-on: ubuntu-latest

    concurrency:
      group: review-certificate-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true

    permissions:
      contents: read
      issues: read
      pull-requests: read
      statuses: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: scripts

      - name: Verify the review certificate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: python3 scripts/review_certificate.py verify --pr "$PR_NUMBER" --post-status
