name: Review Certificate
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
    && format('Certify #{0} {1}', inputs.pr, inputs.digest)
    || format('Verify #{0}', github.event.pull_request.number || github.event.issue.number) }}

# verify runs the default branch's script, which reads the PR's commits and never runs them,
# and sets the review-certificate/<base> status. publish posts a certificate as
# github-actions[bot]; verify trusts it only from a dispatch on the default branch.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string
      digest:
        description: SHA-256 of the certificate's canonical JSON
        required: true
        type: string
      certificate:
        description: The certificate, as canonical JSON
        required: true
        type: string

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: scripts

      - name: Post the review certificate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
          DIGEST: ${{ inputs.digest }}
          CERTIFICATE: ${{ inputs.certificate }}
        run: python3 scripts/review_certificate.py publish --pr "$PR_NUMBER" --digest "$DIGEST"

  # Every status write goes through this job and its group, so the run that started last,
  # and so read the comments last, posts last.
  verify:
    needs: publish
    if: >-
      ${{ !cancelled() && (
        (github.event_name == 'workflow_dispatch' && needs.publish.result == 'success'
          && github.ref_name == github.event.repository.default_branch)
        || (github.event_name == 'pull_request_target'
          && (github.event.action != 'edited' || github.event.changes.base))
        || (github.event_name == 'issue_comment' && github.event.issue.pull_request
          && github.event.comment.user.login == 'github-actions[bot]'
          && (startsWith(github.event.comment.body, '<!-- turingdb-review-certificate -->')
            || startsWith(github.event.changes.body.from, '<!-- turingdb-review-certificate -->')))) }}
    runs-on: ubuntu-latest

    concurrency:
      group: review-certificate-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
      cancel-in-progress: true

    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
      statuses: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: scripts

      - name: Verify the review certificate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
        run: python3 scripts/review_certificate.py verify --pr "$PR_NUMBER" --post-status
