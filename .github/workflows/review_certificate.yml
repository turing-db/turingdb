name: Review Certificate
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
    && format('Certify #{0} {1}', inputs.pr, inputs.digest)
    || format('Verify #{0}', github.event.pull_request.number || github.event.issue.number) }}

# Both jobs run the default branch's script, which only reads the PR's commits and never
# runs them. publish posts a certificate as github-actions[bot]; the run's title vouches for
# its content. verify sets the review-certificate/<base> commit status on the PR head.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string
      digest:
        description: SHA-256 of the certificate's canonical JSON
        required: true
        type: string
      certificate:
        description: The certificate, as canonical JSON
        required: true
        type: string

jobs:
  verify:
    if: >-
      (github.event_name == 'pull_request_target'
        && (github.event.action != 'edited' || github.event.changes.base))
      || (github.event_name == 'issue_comment' && github.event.issue.pull_request
        && (startsWith(github.event.comment.body, '<!-- turingdb-review-certificate -->')
          || startsWith(github.event.changes.body.from, '<!-- turingdb-review-certificate -->')))
    runs-on: ubuntu-latest

    concurrency:
      group: review-certificate-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true

    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
      statuses: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: scripts

      - name: Verify the review certificate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: python3 scripts/review_certificate.py verify --pr "$PR_NUMBER" --post-status

  publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
      statuses: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: scripts

      - name: Post the review certificate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
          DIGEST: ${{ inputs.digest }}
          CERTIFICATE: ${{ inputs.certificate }}
        run: python3 scripts/review_certificate.py publish --pr "$PR_NUMBER" --digest "$DIGEST"
