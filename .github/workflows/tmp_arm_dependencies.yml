name: Temp ARM Dependencies Cache

on:
  push:
    branches: [ "ci-macos-dependencies-cache" ]


jobs:
  dependencies:
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-24.04-arm", "ubuntu-26.04-arm"]

    runs-on: ${{ matrix.os }}

    env:
      BUILD_JOBS: 4

    steps:
    - name: Free disk space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: false
        docker-images: false
        swap-storage: false

    - name: Install git-lfs
      run: |
        sudo apt-get update
        sudo apt-get install -y git-lfs
        git lfs install

    - uses: actions/checkout@v4
      with:
        lfs: true

    - name: Checkout submodules (shallow)
      run: |
        attempt=1
        max_attempts=3
        until git submodule update --init --depth 1 && \
              git submodule foreach '
                if [ "$name" != "external/AFLplusplus" ]; then
                    git submodule update --init --recursive --depth 1
                fi
              '; do
            if [ "$attempt" -ge "$max_attempts" ]; then
                echo "Submodule init failed after $attempt attempts"
                exit 1
            fi
            echo "Submodule init attempt $attempt failed; retrying after backoff"
            sleep $((attempt * 10))
            attempt=$((attempt + 1))
        done

    # Same path and key as the GitHub-hosted cache step in ci_build.yml, so its jobs restore this entry.
    - name: Cache dependencies (GitHub-hosted)
      id: cache-dependencies-github-hosted
      uses: actions/cache@v4
      with:
        path: external/dependencies
        key: ${{ matrix.os }}-dependencies-${{ hashFiles('install_build_tools.sh', 'dependencies.sh', '.gitmodules') }}

    - name: Install build tools
      run: ./install_build_tools.sh

    - name: Build dependencies
      run: ./dependencies.sh
      env:
        SKIP_BUILD_IF_CACHED: ${{ steps.cache-dependencies-github-hosted.outputs.cache-hit }}

    - name: Disk usage
      if: always()
      run: |
        df -h
        du -sh external/dependencies
