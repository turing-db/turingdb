name: CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  workflow_call:
    inputs:
      os_list:
        required: true
        type: string
      python_version_list:
        required: true
        type: string
      dev_version_suffix:
        required: false
        type: string
        default: ''

  workflow_dispatch:


jobs:
  build:
    strategy:
      # Don't cancel the whole matrix when one job fails: on the shared
      # self-hosted runners a single transient flake would otherwise cancel the
      # others mid-build, whose post-steps then save partial external/dependencies
      # trees and poison the per-OS cache. Letting jobs finish keeps caches clean.
      fail-fast: false
      matrix:
        # PR and main-push builds are Linux-only: macOS is the slow half of the
        # matrix and has not caught a Linux-clean regression. macOS is still a
        # shipped platform, built by the release matrix in ci_release.yml and by
        # ci_full_matrix_build.yml, the pre-tag check to run before a release.
        os: ${{ fromJson(inputs.os_list || '["ubuntu-24.04-turing"]') }}
        python_version: ${{ fromJson(inputs.python_version_list || '["3.14"]') }}

    # Each matrix.os value is the literal runner label it dispatches to: the ubuntu-*-turing
    # and macos*-turing labels are self-hosted runners; ubuntu-*-arm are GitHub-hosted.
    runs-on: ${{ matrix.os }}

    # Cap build parallelism at 4 across every step. The shared self-hosted runners
    # share host memory across instances, so -j nproc on the heavy LLVM/MLIR (and
    # wheel) compiles trips the OOM killer ("Killed signal terminated program
    # cc1plus"). BUILD_JOBS feeds dependencies.sh; CMAKE_BUILD_PARALLEL_LEVEL caps
    # the scikit-build-core wheel build.
    env:
      BUILD_JOBS: 4
      CMAKE_BUILD_PARALLEL_LEVEL: 4

    steps:
    # Only the disk-constrained GitHub-hosted Linux runners (the -arm labels)
    # need this. The self-hosted -turing containers are lean images that never
    # shipped the android/dotnet/haskell bloat this action strips, so it frees
    # nothing there; its df|awk savings sum also mis-parses the large host
    # filesystem ("invalid arithmetic operator"). The -turing containers reclaim
    # disk via the clean-self-hosted-runner step at the end of the job instead.
    # docker-images is off: the -arm runners don't need it, and on -turing the
    # mounted host docker.sock means it would prune the *shared host* daemon.
    - name: Free disk space
      if: runner.os == 'Linux' && !contains(matrix.os, 'turing')
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: false
        docker-images: false
        swap-storage: false

    # jlumbroso/free-disk-space only supports Ubuntu. The macOS image ships
    # nine Xcode versions plus iOS/tvOS/watchOS/visionOS simulator runtimes,
    # leaving only ~44GB free out of 320GB, which is not enough for a
    # from-source LLVM/MLIR build + regress. Keep the selected Xcode and
    # delete the rest.
    - name: Free disk space (macOS)
      if: runner.os == 'macOS'
      run: |
        ACTIVE_XCODE=$(dirname "$(dirname "$(xcode-select -p)")")
        echo "Keeping $ACTIVE_XCODE"
        sudo xcrun simctl runtime delete all || true
        for xcode in /Applications/Xcode*.app; do
            if [ "$xcode" != "$ACTIVE_XCODE" ]; then
                sudo rm -rf "$xcode" &
            fi
        done
        sudo rm -rf "$HOME/Library/Android" &
        sudo rm -rf "$HOME/.dotnet" &
        sudo rm -rf "$HOME/hostedtoolcache/CodeQL" &
        wait

    - name: Disk usage (initial)
      run: df -h

    # The GitHub-hosted ubuntu-*-arm runner images don't ship git-lfs, so the
    # lfs: true checkout below fails with "Unable to locate executable file:
    # git-lfs". Install it before checkout. The self-hosted ubuntu-*-turing and
    # macos*-turing runners already have git-lfs, so scope this to the ARM labels.
    - name: Install git-lfs (GitHub-hosted ARM)
      if: contains(matrix.os, 'arm')
      run: |
        sudo apt-get update
        sudo apt-get install -y git-lfs
        git lfs install

    - uses: actions/checkout@v4
      with:
        persist-credentials: true
        lfs: true
        fetch-depth: 500

    - name: Fetch tags
      run: git fetch --tags --force

    - name: Checkout submodules (shallow)
      run: |
        attempt=1
        max_attempts=3
        until git submodule update --init --depth 1 && \
              git submodule foreach '
                if [ "$name" != "external/AFLplusplus" ]; then
                    git submodule update --init --recursive --depth 1
                fi
              '; do
            if [ "$attempt" -ge "$max_attempts" ]; then
                echo "Submodule init failed after $attempt attempts"
                exit 1
            fi
            echo "Submodule init attempt $attempt failed; retrying after backoff"
            sleep $((attempt * 10))
            attempt=$((attempt + 1))
        done

    - name: Install uv
      uses: astral-sh/setup-uv@v3

    # Both the self-hosted Linux runner containers and the macOS minis use a
    # local on-disk cache instead of the GitHub-hosted cache (no cache egress).
    # The cache dir is pre-provisioned per runner: /opt/actions-local-cache in
    # the Linux runner containers, /Users/m1/actions-local-cache on the minis.
    - name: Cache dependencies (Linux)
      id: cache-dependencies-linux
      if: runner.os == 'Linux'
      uses: corca-ai/local-cache@v2
      with:
        base: /opt/actions-local-cache
        path: external/dependencies
        # The salt busts poisoned entries: fail-fast-cancelled jobs saved
        # partial external/dependencies trees (e.g. missing curl) under this
        # per-OS key, which later cache-hit jobs then restored and failed on at
        # find_package. Bump the salt to discard them and re-save a clean tree
        # (with fail-fast disabled, jobs now run to completion so caches stay clean).
        key: ${{ matrix.os }}-dependencies-v3-${{ hashFiles('install_build_tools.sh', 'dependencies.sh', '.gitmodules', 'build.sh') }}

    # The macOS minis share one cache base across several runner instances, and
    # corca-ai/local-cache symlinks external/dependencies straight into that
    # shared base while populating it with a non-atomic mv. A job could thus link
    # against a half-published tree and fail (e.g. a missing libopenblas.a).
    # Serialize restore and publish under the same per-host flock the regress
    # step uses, so a job never symlinks into an in-progress publish.
    - name: Restore dependency cache (macOS)
      id: cache-dependencies-macos
      if: runner.os == 'macOS'
      run: |
        python3 scripts/with_host_lock.py /tmp/turingdb-depcache.lock \
          bash scripts/dep_cache.sh restore \
          /Users/m1/actions-local-cache \
          "${{ matrix.os }}-dependencies-${{ hashFiles('install_build_tools.sh', 'dependencies.sh', '.gitmodules', 'build.sh', 'scripts/dep_cache.sh') }}"

    - name: Install build tools
      run: ./install_build_tools.sh

    - name: Build dependencies
      run: ./dependencies.sh
      env:
        SKIP_BUILD_IF_CACHED: ${{ steps.cache-dependencies-linux.outputs.cache-hit || steps.cache-dependencies-macos.outputs.cache-hit }}

    - name: Publish dependency cache (macOS)
      if: runner.os == 'macOS' && steps.cache-dependencies-macos.outputs.cache-hit != 'true'
      run: |
        python3 scripts/with_host_lock.py /tmp/turingdb-depcache.lock \
          bash scripts/dep_cache.sh publish \
          /Users/m1/actions-local-cache \
          "${{ matrix.os }}-dependencies-${{ hashFiles('install_build_tools.sh', 'dependencies.sh', '.gitmodules', 'build.sh', 'scripts/dep_cache.sh') }}"

    - name: Setup Python
      run: uv python install ${{ matrix.python_version }}

    - name: Compute version override
      id: version
      if: inputs.dev_version_suffix != ''
      run: |
        # Always bump patch and add a dev suffix so nightlies never collide with a published tag version on PyPI,
        # including the edge case where HEAD sits exactly on the latest tag (distance == 0).
        DESC=$(git describe --tags --match 'v*' --first-parent --abbrev=0)
        TAG_VERSION=${DESC#v}
        IFS='.' read -r MAJOR MINOR PATCH <<< "$TAG_VERSION"
        PATCH=${PATCH:-0}
        PATCH=$((PATCH + 1))
        VERSION="${MAJOR}.${MINOR}.${PATCH}.dev${{ inputs.dev_version_suffix }}"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Computed version override: $VERSION"

    - name: Build wheel
      run: |
        if [ -n "$VERSION_OVERRIDE" ]; then
          export SETUPTOOLS_SCM_PRETEND_VERSION="$VERSION_OVERRIDE"
          echo "Using version: $SETUPTOOLS_SCM_PRETEND_VERSION"
        fi
        ./build.sh
      env:
        PYTHON_VERSION: ${{ matrix.python_version }}
        VERSION_OVERRIDE: ${{ steps.version.outputs.version }}

    - name: Run unit tests
      run: |
        cd build
        make test ARGS="--output-on-failure"

    - name: Verify wheel installation
      run: |
        uv venv .venv-test --python ${{ matrix.python_version }}
        uv pip install wheel/*.whl --python .venv-test/bin/python
        # Run the smoke test under the same host lock the regress step uses. The
        # regress suite does a host-wide `pkill -9 turingdb`, and the self-hosted
        # macOS minis share one host with no PID isolation, so an unlocked
        # `turingdb --help` here can be SIGKILLed (exit 137) by a sibling job's
        # regress. Holding the lock serializes it against regress so it is never
        # caught in that pkill. The contract is: anything that runs turingdb on
        # the shared host takes this lock.
        python3 scripts/with_host_lock.py /tmp/turingdb-regress.lock .venv-test/bin/turingdb --help

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-west-2

    # The reactome regress test runs on Linux only (load_jsonl_reactome/run.sh
    # skips on macOS), so reactome.jsonl is only ever downloaded on the Linux
    # runners. Cache it there; there is nothing to cache on macOS. This stays on
    # the GitHub-hosted cache (not the local on-disk cache used for deps above)
    # because corca-ai/local-cache is directory-only and hard-fails on a
    # single-file path like this one.
    - name: Cache reactome dataset (Linux)
      if: runner.os == 'Linux'
      uses: actions/cache@v4
      with:
        path: external/datasets/reactome.jsonl
        key: dataset-reactome-v1

    - name: Disk usage (before regress)
      run: df -h

    # The json_escape_properties regress test shells out to `node`, which the
    # GitHub-hosted ubuntu ARM images don't ship (the x86/turing runners do).
    # Installed here (not in install_build_tools.sh) to keep node out of the
    # dependency cache key, since it is only a regress-runtime dependency.
    - name: Install Node.js (GitHub-hosted ARM)
      if: contains(matrix.os, 'arm')
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'

    # The regress suite assumes exclusive use of the host (fixed port 6666 and a
    # host-wide `pkill -9 turingdb`), but several self-hosted runner instances share
    # one physical machine. Serialize regress per host with a kernel flock that the OS
    # releases automatically when the job ends, however it ends.
    - name: Run regress
      run: python3 scripts/with_host_lock.py /tmp/turingdb-regress.lock ./run_regress.sh

    - name: Disk usage (after regress)
      if: always()
      run: df -h

    - name: Upload wheel artifact
      uses: actions/upload-artifact@v4
      with:
        name: turingdb-wheel-${{ matrix.os }}-py${{ matrix.python_version }}
        path: wheel/*.whl

    # The self-hosted -turing runners are persistent: their workspace and
    # container filesystem are reused between jobs, so build trees (build/, the
    # test venvs, the wheel) and per-job writable-layer growth ($HOME/.local,
    # .cache, .turing and /tmp) accumulate until the host disk fills. Reclaim
    # them at the end of every job, as if the container had been recreated.
    # Runs before the cache actions' post-steps, so it must never touch
    # external/ (corca-ai/local-cache and actions/cache save it there).
    - name: Reclaim disk (self-hosted)
      if: always() && runner.os == 'Linux' && contains(matrix.os, 'turing')
      uses: ./.github/actions/clean-self-hosted-runner
