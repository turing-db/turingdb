name: CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  workflow_call:
    inputs:
      os_list:
        required: true
        type: string
      python_version_list:
        required: true
        type: string
      dev_version_suffix:
        required: false
        type: string
        default: ''

  workflow_dispatch:


jobs:
  build:
    strategy:
      matrix:
        os: ${{ fromJson(inputs.os_list || '["ubuntu-24.04", "macos-15"]') }}
        python_version: ${{ fromJson(inputs.python_version_list || '["3.14"]') }}

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: true
        lfs: true
        fetch-depth: 0

    - name: Checkout submodules (shallow)
      run: git submodule update --init --recursive --depth 1

    - name: Install uv
      uses: astral-sh/setup-uv@v3

    - name: Cache dependencies
      id: cache-dependencies
      uses: actions/cache@v4
      with:
        path: external/dependencies
        key: ${{ matrix.os }}-dependencies-${{ hashFiles('install_build_tools.sh', 'dependencies.sh', '.gitmodules', 'build.sh') }}

    - name: Install build tools
      run: ./install_build_tools.sh

    - name: Build dependencies
      run: ./dependencies.sh
      env:
        SKIP_BUILD_IF_CACHED: ${{ steps.cache-dependencies.outputs.cache-hit }}

    - name: Setup Python
      run: uv python install ${{ matrix.python_version }}

    - name: Compute version override
      id: version
      if: inputs.dev_version_suffix != ''
      run: |
        DESC=$(git describe --tags --long --match 'v*' --first-parent)
        TAG_VERSION=$(echo "$DESC" | sed 's/^v\(.*\)-[0-9]*-g[0-9a-f]*$/\1/')
        DISTANCE=$(echo "$DESC" | sed 's/^v.*-\([0-9]*\)-g[0-9a-f]*$/\1/')
        if [ "$DISTANCE" != "0" ]; then
          IFS='.' read -r MAJOR MINOR PATCH <<< "$TAG_VERSION"
          PATCH=${PATCH:-0}
          PATCH=$((PATCH + 1))
          VERSION="${MAJOR}.${MINOR}.${PATCH}.dev${{ inputs.dev_version_suffix }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Computed version override: $VERSION"
        fi

    - name: Build wheel
      run: |
        if [ -n "$VERSION_OVERRIDE" ]; then
          export SETUPTOOLS_SCM_PRETEND_VERSION="$VERSION_OVERRIDE"
          echo "Using version: $SETUPTOOLS_SCM_PRETEND_VERSION"
        fi
        ./build.sh
      env:
        PYTHON_VERSION: ${{ matrix.python_version }}
        VERSION_OVERRIDE: ${{ steps.version.outputs.version }}

    - name: Prepare SimpleDB
      run: |
        cd build/samples/simpledb
        ./simpledb
        mkdir -p $HOME/.turing/graphs
        cp -r simpledb.out/simpledb $HOME/.turing/graphs

    - name: Run unit tests
      run: |
        cd build
        make test ARGS="--output-on-failure"

    - name: Verify wheel installation
      run: |
        uv venv .venv-test --python ${{ matrix.python_version }}
        uv pip install wheel/*.whl --python .venv-test/bin/python
        .venv-test/bin/turingdb --help

    - name: Run regress
      run: |
        ./run_regress.sh

    - name: Upload wheel artifact
      uses: actions/upload-artifact@v4
      with:
        name: turingdb-wheel-${{ matrix.os }}-py${{ matrix.python_version }}
        path: wheel/*.whl
