name: Release Ubuntu

on:
  schedule:
    - cron: "0 2 * * *"
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-release:
    name: Build Release Wheels
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - name: Install git (for checkout with submodules)
      run: |
        dnf install -y git git-lfs

    - uses: actions/checkout@v4
      with:
        submodules: recursive
        persist-credentials: true
        lfs: true
        fetch-depth: 0

    - name: Configure git safe directory
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Setup Python path
      run: |
        # Convert Python version (e.g., "3.10") to path format (e.g., "cp310-cp310")
        PYTHON_VERSION_NODOT=$(echo '${{ matrix.python-version }}' | tr -d '.')
        PYTHON_PATH="/opt/python/cp${PYTHON_VERSION_NODOT}-cp${PYTHON_VERSION_NODOT}/bin"
        echo "$PYTHON_PATH" >> $GITHUB_PATH
        echo "PYTHON_PATH=$PYTHON_PATH" >> $GITHUB_ENV

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Install system dependencies
      run: |
        # manylinux_2_28 uses AlmaLinux 8 (RHEL 8 compatible)
        dnf install -y \
          curl libcurl-devel \
          zlib-devel \
          openssl-devel \
          flex \
          openblas-devel \
          patchelf \
          cmake make gcc gcc-c++ \
          m4 texinfo

        # Install newer bison (3.8+) from source - AlmaLinux 8's bison 3.0.4
        # doesn't support --warning=counterexamples needed by the project
        curl -L https://ftp.gnu.org/gnu/bison/bison-3.8.2.tar.xz | tar xJ
        cd bison-3.8.2
        ./configure --prefix=/usr/local
        make -j$(nproc)
        make install
        cd ..
        rm -rf bison-3.8.2
        # Ensure the new bison is found first
        echo "/usr/local/bin" >> $GITHUB_PATH

    - name: Cache dependencies
      id: cache-dependencies
      uses: actions/cache@v4
      with:
        path: external/dependencies
        key: manylinux_2_28-dependencies-${{ hashFiles('dependencies.sh', '.gitmodules') }}

    - name: Install project dependencies
      if: steps.cache-dependencies.outputs.cache-hit != 'true'
      run: ./dependencies.sh

    - name: Build wheel
      run: |
        # Convert Python version (e.g., "3.10") to tag format (e.g., "cp310")
        export PYTHON_TAG="cp$(echo '${{ matrix.python-version }}' | tr -d '.')"
        source $GITHUB_WORKSPACE/setup.sh
        $PYTHON_PATH/python -m pip install build setuptools wheel setuptools-scm
        $PYTHON_PATH/python -m build --wheel

    - name: Prepare SimpleDB
      run: |
        cd build/samples/simpledb
        ./simpledb
        mkdir -p $HOME/.turing/graphs
        cp -r simpledb.out/simpledb $HOME/.turing/graphs

    - name: Run unit tests
      run: |
        cd build
        make test

    - name: Repair wheel with auditwheel
      run: |
        mkdir -p wheelhouse
        $PYTHON_PATH/python -m pip install auditwheel
        # Use manylinux_2_28 for broad compatibility (glibc 2.28+)
        auditwheel repair dist/*.whl -w wheelhouse --plat manylinux_2_28_x86_64

    - name: Verify wheel platform tags
      run: |
        echo "Verifying wheel platform tags..."
        for wheel in wheelhouse/*.whl; do
          if [[ "$wheel" == *"-none-any.whl" ]]; then
            echo "ERROR: Found platform-independent wheel: $wheel"
            echo "Packages with native binaries must have platform-specific tags"
            exit 1
          fi
          echo "OK: $wheel"
        done

    - name: Run regress
      run: |
        cd build
        source $GITHUB_WORKSPACE/setup.sh
        make run_regress

    - name: Upload wheel artifact
      uses: actions/upload-artifact@v4
      with:
        name: turingdb-wheel-linux-py${{ matrix.python-version }}
        path: wheelhouse/*.whl

  publish:
    name: Publish to PyPI
    needs: build-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/turingdb
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: turingdb-wheel-linux-py*
          path: wheelhouse/
          merge-multiple: true

      - name: Verify no platform-independent wheels
        run: |
          echo "Final verification before publish..."
          for wheel in wheelhouse/*.whl; do
            if [[ "$wheel" == *"-none-any.whl" ]]; then
              echo "ERROR: Found platform-independent wheel: $wheel"
              exit 1
            fi
            echo "Will publish: $wheel"
          done

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: wheelhouse/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheelhouse/
          skip-existing: true
