name: Docker Nightly Build

on:
  schedule:
    - cron: "0 4 * * *"   # nightly at 04:00 UTC
  workflow_dispatch:

jobs:
  build-wheel:
    uses: ./.github/workflows/ci_build.yml
    with:
      os_list: '["ubuntu-24.04"]'
      python_version_list: '["3.14"]'
    secrets: inherit

  docker:
    needs: build-wheel
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Disk usage (initial)
        run: df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: turingdb-wheel-ubuntu-24.04-py3.14
          path: wheel/

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Docker tag
        run: echo "IMAGE_TAG=nightly" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: turingdbai/turingdb:${{ env.IMAGE_TAG }}

      - name: Test Docker image
        run: |
          docker run --rm turingdbai/turingdb:${{ env.IMAGE_TAG }} turingdb --help

      - name: Save Docker image
        run: |
          docker save \
            turingdbai/turingdb:${IMAGE_TAG} \
            -o turingdb-image-${IMAGE_TAG}.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: turingdb-docker-image-${{ env.IMAGE_TAG }}
          path: turingdb-image-${{ env.IMAGE_TAG }}.tar
