name: Docker Nightly Build

on:
  schedule:
    - cron: "0 4 * * *"   # nightly at 04:00 UTC
  workflow_dispatch:

jobs:
  build-wheel:
    uses: ./.github/workflows/ci_build.yml
    with:
      os_list: '["ubuntu-24.04", "ubuntu-24.04-arm"]'
      python_version_list: '["3.14"]'
    secrets: inherit

  docker:
    needs: build-wheel
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
            platform: linux/amd64
          - os: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Disk usage (initial)
        run: df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: turingdb-wheel-${{ matrix.os }}-py3.14
          path: wheel/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Docker tag
        run: echo "IMAGE_TAG=latest" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          load: true
          platforms: ${{ matrix.platform }}
          tags: turingdbai/turingdb:${{ env.IMAGE_TAG }}-${{ matrix.arch }}

      - name: Test Docker image
        run: |
          docker run --rm turingdbai/turingdb:${{ env.IMAGE_TAG }}-${{ matrix.arch }} turingdb --help

      - name: Save Docker image
        run: |
          docker save \
            turingdbai/turingdb:${IMAGE_TAG}-${{ matrix.arch }} \
            -o turingdb-image-${IMAGE_TAG}-${{ matrix.arch }}.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: turingdb-docker-image-${{ env.IMAGE_TAG }}-${{ matrix.arch }}
          path: turingdb-image-${{ env.IMAGE_TAG }}-${{ matrix.arch }}.tar

  manifest:
    needs: docker
    runs-on: ubuntu-24.04
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Docker tag
        run: echo "IMAGE_TAG=latest" >> $GITHUB_ENV

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create -t turingdbai/turingdb:${IMAGE_TAG} \
            turingdbai/turingdb:${IMAGE_TAG}-amd64 \
            turingdbai/turingdb:${IMAGE_TAG}-arm64
